name: Update CoocaaTV M3U

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CoocaaTV
        run: |
          curl -L \
            -H 'User-Agent: OTT Navigator/1.7.4.1 (Linux;Android 9; vi; tc3fcx)' \
            -H 'Connection: keep-alive' \
            -H 'Accept: */*' \
            -H 'Accept-Encoding: gzip' \
            'https://coocaatv.dpdns.org/xem-tv' \
            -o response.bin

      - name: Decompress if GZIP
        run: |
          if [ "$(xxd -p -l 2 response.bin)" = "1f8b" ]; then
            echo "GZIP detected -> decompressing..."
            gzip -dc response.bin > coocaatv.m3u
          else
            echo "Response is not GZIP."
            mv response.bin coocaatv.m3u
          fi

      - name: Check M3U
        run: |
          if grep -q '^#EXTM3U' coocaatv.m3u; then
            echo "M3U hợp lệ."
            echo "Channels: $(grep -c '^#EXTINF:' coocaatv.m3u || true)"
          else
            echo "Không tìm thấy #EXTM3U."
            file coocaatv.m3u
            head -20 coocaatv.m3u
            exit 1
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add coocaatv.m3u

          if git diff --cached --quiet; then
            echo "Không có thay đổi."
          else
            git commit -m "Update CoocaaTV M3U"
            git push
          fi
