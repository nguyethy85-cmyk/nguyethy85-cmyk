name: JSON Auto Update

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install Python packages
        run: |
          pip install requests


      - name: Download JSON
        run: |
          python3 download_json.py


      - name: Update JSON
        run: |
          python3 update_json.py


      - name: Save changes
        run: |

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add source.json channels.json

          git commit -m "Update channels JSON" || echo "No changes"

          git push
