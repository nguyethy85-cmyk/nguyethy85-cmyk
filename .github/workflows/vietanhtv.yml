
name: Auto Update M3U

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download M3U playlist
        env:
          M3U_URL: "https://tv.vietanhtv.top/tivi/index.php?u=loc_1234&p=chanbomaydi"
        run: |
          curl -L \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            "$M3U_URL" \
            -o playlist.m3u

          if ! grep -qE '^#EXTM3U' playlist.m3u; then
            echo "Invalid M3U playlist!"
            exit 1
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u

          if ! git diff --cached --quiet; then
            git commit -m "Auto update M3U playlist"
            git push
          else
            echo "Playlist unchanged."
          fi
          
